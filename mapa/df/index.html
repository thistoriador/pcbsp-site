<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distrito Federal 2022 • Mapa dos Votos PCB-SP</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe5;font-family:Arial,sans-serif;color:#1c1a18}header{background:#87080f;color:#fff;padding:18px 22px;border-bottom:5px solid #f0c52b}header b{font-size:26px}header em{color:#f0c52b;font-style:normal}.top{padding:10px 15px;background:#fff;display:flex;gap:8px;border-bottom:1px solid #ddd}.pill{border:1px solid #d8d0c5;border-radius:22px;padding:9px 13px;background:#fff;font-weight:800}.red{background:#b80e19;color:#fff}.wrap{max-width:1000px;margin:auto;padding:18px}.note{background:#fff3cf;border:1px solid #e4ca70;border-radius:12px;padding:12px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#fff;border:1px solid #ddd4c7;border-radius:12px;padding:14px}.card strong{font-size:18px}.n{font-size:25px;font-weight:900;color:#b80e19;margin-top:8px}.muted{color:#756f67;font-size:13px}</style></head><body><header><b>MAPA DOS VOTOS <em>PCB-SP</em></b><div>DISTRITO FEDERAL • 2022</div></header><div class="top"><button class="pill" onclick="location.href='/mapa/sp-modular/'">← SÃO PAULO</button><button class="pill red">DF • 2022</button></div><main class="wrap"><div class="note"><b>Dados oficiais TSE 2022.</b> O Distrito Federal não possui municípios; por isso este módulo não usa a malha municipal dos demais estados. A base será detalhada por zonas/seções em etapa própria.</div><div id="cards" class="cards"></div></main><script>fetch('dados.json?v=1').then(r=>r.json()).then(d=>{document.getElementById('cards').innerHTML=d.candidatos.map(c=>'<div class="card"><strong>'+c.nome+'</strong><div class="muted">'+c.cargo+' • PCB '+c.numero+'</div><div class="n">'+Number(c.total).toLocaleString('pt-BR')+' votos</div></div>').join('')})</script></body></html>
