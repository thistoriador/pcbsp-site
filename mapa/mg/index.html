<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa dos Votos PCB-SP · Minas Gerais 2026</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--r:#b80e19;--rd:#850810;--y:#f0c52b;--bg:#f4efe5;--p:#fffdf9;--ink:#1c1a18;--mut:#756f67;--line:#ded5c8}*{box-sizing:border-box}body{margin:0;background:#f4efe5;font-family:Arial,sans-serif;color:var(--ink)}header{background:#87080f;color:#fff;padding:20px 25px;border-bottom:5px solid var(--y)}header b{font-size:27px}header em{color:var(--y);font-style:normal}.top{padding:11px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}.pill{border:1px solid var(--line);border-radius:22px;padding:9px 14px;background:#fff;font-weight:800}.pill.red{background:var(--r);color:#fff}.status{margin:12px 16px 0;padding:10px 13px;background:#fff3cf;border:1px solid #e4ca70;border-radius:10px}.wrap{padding:14px 16px 50px}.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.cand{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left;cursor:pointer}.cand.active{border:3px solid var(--r);padding:11px}.cand strong{display:block;font-size:17px}.cand small{color:var(--mut)}.cand .n{font-size:24px;font-weight:900;color:var(--r);margin-top:7px}.main{display:grid;grid-template-columns:1.45fr .72fr;gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:22px}.head small{color:var(--mut)}#map{height:590px;background:#c8c8c8}.legend{position:absolute;z-index:500;right:10px;top:10px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.7}.mapbox{position:relative}.panel{height:590px;overflow:auto}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:#fff;padding:11px;font-weight:800}.tabs button.active{color:var(--r);border-bottom:3px solid var(--r)}.search{padding:10px}.search input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:9px}.row{padding:10px 12px;border-top:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:8px;cursor:pointer}.row:hover{background:#fff4d9}.row b:last-child{color:var(--r)}.detail{padding:14px}.detail h3{font-size:23px;margin:0 0 4px}.vote{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.vote b:last-child{color:var(--r)}@media(max-width:900px){.cands{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}#map{height:430px}.panel{height:500px}}@media(max-width:520px){.cands{grid-template-columns:1fr}.top{overflow:auto}header b{font-size:22px}}
</style></head><body><header><b>MAPA DOS VOTOS <em>PCB-SP</em></b><div>TERRITÓRIO • HISTÓRIA • ELEIÇÕES</div></header><div class="top"><button class="pill" onclick="location.href='/mapa/'">← SÃO PAULO</button><button class="pill red">MINAS GERAIS • 2026</button></div><div id="status" class="status">Carregando votos municipais oficiais…</div><main class="wrap"><section id="cands" class="cands"></section><section class="main"><div class="card"><div class="head"><div><h2>Minas Gerais</h2><small id="mapSub">853 municípios</small></div></div><div class="mapbox"><div id="map"></div><div class="legend" id="legend"></div></div></div><div class="card"><div class="head"><div><h2 id="pt">Municípios</h2><small id="ps">2026</small></div><button class="pill" onclick="showRanking()">Lista</button></div><div class="tabs"><button id="tr" class="active" onclick="showRanking()">Ranking</button><button id="tm" onclick="showAll()">Municípios</button></div><div class="search"><input id="q" placeholder="Buscar município…" oninput="filterRows()"></div><div class="panel" id="panel"></div></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const NAMES=["EDMILSON COSTA","TÚLIO LOPES","MÁRIO MARIANO","JÉSSICA CARVALHO","ZULU","LEGENDA 21"],TOTALS={"EDMILSON COSTA":2300,"TÚLIO LOPES":10957,"MÁRIO MARIANO":761,"JÉSSICA CARVALHO":745,"ZULU":199,"LEGENDA 21":3240},CARGO={"EDMILSON COSTA":"Presidente • PCB 21","TÚLIO LOPES":"Governador • PCB 21","MÁRIO MARIANO":"Deputado Estadual • PCB 21000","JÉSSICA CARVALHO":"Deputada Estadual • PCB 21180","ZULU":"Deputado Estadual • PCB 21113","LEGENDA 21":"Deputado Estadual • PCB 21"};
let rows=[],byIbge=new Map(),layers=new Map(),map,geo,selected="TÚLIO LOPES",mode="ranking";
const fmt=n=>Number(n||0).toLocaleString("pt-BR");
function color(v,max){if(!v)return "#d1cbc1";let x=v/max;if(x>.60)return "#65050c";if(x>.30)return "#930914";if(x>.15)return "#bd1520";if(x>.06)return "#df4650";return "#f28b91"}
function cards(){document.getElementById("cands").innerHTML=NAMES.map(n=>'<button class="cand '+(n===selected?'active':'')+'" onclick="selectCand(\''+n+'\')"><strong>'+n+'</strong><small>'+CARGO[n]+'</small><div class="n">'+fmt(TOTALS[n])+' votos</div></button>').join("")}
function selectCand(n){selected=n;cards();paint();showRanking()}
function paint(){let max=Math.max(...rows.map(r=>r.candidatos[selected]||0),1),withVotes=0;rows.forEach(r=>{let v=r.candidatos[selected]||0;if(v>0)withVotes++;let l=layers.get(String(r.codigo_ibge));if(l)l.setStyle({fillColor:color(v,max),fillOpacity:1})});document.getElementById("mapSub").textContent=selected+" • "+fmt(TOTALS[selected])+" votos • "+withVotes+" municípios com votos";document.getElementById("legend").innerHTML="<b>"+selected+"</b><br><span style='color:#7e0710'>■</span> mais votos<br><span style='color:#d22b35'>■</span> votação intermediária<br><span style='color:#f4a5a8'>■</span> menos votos<br><span style='color:#d8d3cb'>■</span> zero voto"}
function ranked(){return rows.filter(r=>(r.candidatos[selected]||0)>0).sort((a,b)=>(b.candidatos[selected]||0)-(a.candidatos[selected]||0)||a.municipio.localeCompare(b.municipio,"pt-BR"))}
function showRanking(){mode="ranking";tabs();document.getElementById("pt").textContent=selected;document.getElementById("ps").textContent="Municípios com votos • maior para menor";render(ranked())}
function showAll(){mode="all";tabs();document.getElementById("pt").textContent="Municípios";document.getElementById("ps").textContent="853 municípios • clique para ver os quatro candidatos";render(rows.slice().sort((a,b)=>a.municipio.localeCompare(b.municipio,"pt-BR")))}
function tabs(){document.getElementById("tr").classList.toggle("active",mode==="ranking");document.getElementById("tm").classList.toggle("active",mode==="all");document.getElementById("q").value=""}
function render(a){document.getElementById("panel").innerHTML=a.map(r=>'<div class="row" onclick="openCity(\''+r.codigo_ibge+'\')"><b>'+r.municipio+'</b><b>'+fmt(r.candidatos[selected]||0)+'</b></div>').join("")||'<div class="detail">Nenhum município.</div>'}
function filterRows(){let q=document.getElementById("q").value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(),a=(mode==="ranking"?ranked():rows).filter(r=>r.municipio.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(q));render(a)}
function openCity(id){let r=byIbge.get(String(id));if(!r)return;let l=layers.get(String(id));if(l){map.fitBounds(l.getBounds(),{padding:[30,30]});l.openPopup()}document.getElementById("pt").textContent=r.municipio;document.getElementById("ps").textContent="Votação dos candidatos acompanhados • 2026";document.getElementById("panel").innerHTML='<div class="detail"><h3>'+r.municipio+'</h3><small>Código TSE '+r.codigo_tse+' • IBGE '+r.codigo_ibge+'</small>'+NAMES.map(n=>'<div class="vote"><span><b>'+n+'</b><br><small>'+CARGO[n]+'</small></span><b>'+fmt(r.candidatos[n]||0)+'</b></div>').join("")+'<br><button class="pill" onclick="showRanking()">← Voltar ao ranking</button></div>'}
async function init(){try{let [vr,gr]=await Promise.all([fetch("/mapa/dados/2026/mg/municipios-interesse.json?v=1",{cache:"no-store"}),fetch("/mapa/dados/2026/mg/municipios.geojson?v=1",{cache:"no-store"})]);if(!vr.ok||!gr.ok)throw Error("arquivos "+vr.status+"/"+gr.status);rows=await vr.json();let gj=await gr.json();if(rows.length!==853)throw Error("base municipal incompleta: "+rows.length);rows.forEach(r=>byIbge.set(String(r.codigo_ibge),r));let sums={};NAMES.forEach(n=>sums[n]=rows.reduce((a,r)=>a+(r.candidatos[n]||0),0));NAMES.forEach(n=>{if(sums[n]!==TOTALS[n])throw Error("total divergente de "+n+": "+sums[n])});map=L.map("map",{zoomControl:true});geo=L.geoJSON(gj,{style:{color:"#6f675f",weight:1.05,fillColor:"#d1cbc1",fillOpacity:1},onEachFeature:(f,l)=>{let id=String(f.properties.id||f.properties.codarea||"");layers.set(id,l);let r=byIbge.get(id);if(r){l.on("click",()=>openCity(id));l.bindPopup("<b>"+r.municipio+"</b><br>Clique para ver os votos")}}}).addTo(map);map.fitBounds(geo.getBounds());cards();paint();showRanking();document.getElementById("status").textContent="✓ Base validada: 853 municípios • Edmilson 2.300 • Túlio 10.957 • Mário 761 • Jéssica 745 • Zulu 199 • Legenda 21 3.240."}catch(e){document.getElementById("status").textContent="ERRO DE VALIDAÇÃO: "+e.message}}
init();</script></body></html>
