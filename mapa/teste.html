<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste API — Mapa do Voto SP</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f0e5;margin:0;padding:24px;color:#171717}
.box{max-width:760px;margin:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 18px #0001}
h1{color:#b5121b}.ok{color:#18794e}.erro{color:#b5121b}.status{font-size:24px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style></head><body><div class="box">
<h1>Mapa do Voto SP</h1><div id="status" class="status">Testando API...</div><div id="resumo"></div><div id="saida"></div>
<script>
const URL='https://cthntxgopxhbaemgnttn.supabase.co';
const KEY='sb_publishable_1mRxuQ1M3IkESIIK4V9nfw_C5iF2g-e';
async function rpc(fn,args={}){
 const r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{
 'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json',
 'Accept-Profile':'api_mapa','Content-Profile':'api_mapa'
 },body:JSON.stringify(args)});
 const t=await r.text();
 if(!r.ok) throw new Error(`HTTP ${r.status}: ${t}`);
 return JSON.parse(t);
}
(async()=>{
 try{
  const [e,c18,c22]=await Promise.all([
    rpc('eleicoes'),
    rpc('candidaturas',{p_ano:2018}),
    rpc('candidaturas',{p_ano:2022})
  ]);
  const t18=c18.reduce((s,x)=>s+Number(x.votos||0),0);
  const t22=c22.reduce((s,x)=>s+Number(x.votos||0),0);
  document.getElementById('status').className='status ok';
  document.getElementById('status').textContent='API CONECTADA ✅';
  document.getElementById('resumo').innerHTML=
    `<p><b>2018:</b> ${c18.length} candidaturas • ${t18.toLocaleString('pt-BR')} votos nominais</p>
     <p><b>2022:</b> ${c22.length} candidaturas • ${t22.toLocaleString('pt-BR')} votos nominais</p>`;
  document.getElementById('saida').innerHTML=
    '<table><tr><th>Ano</th><th>Nome</th><th>Cargo</th><th>Votos</th></tr>'+
    [...c18.map(x=>[2018,x]),...c22.map(x=>[2022,x])]
      .map(([a,x])=>`<tr><td>${a}</td><td>${x.nome}</td><td>${x.cargo}</td><td>${Number(x.votos).toLocaleString('pt-BR')}</td></tr>`)
      .join('')+'</table>';
 }catch(e){
  document.getElementById('status').className='status erro';
  document.getElementById('status').textContent='ERRO NA API ❌';
  document.getElementById('saida').textContent=e.message;
 }
})();
</script></div></body></html>
