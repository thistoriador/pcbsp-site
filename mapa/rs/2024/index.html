<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rio Grande do Sul 2024 • Mapa dos Votos PCB-SP</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe5;font-family:Arial,sans-serif;color:#1c1a18}header{background:#87080f;color:#fff;padding:18px 22px;border-bottom:5px solid #f0c52b}header b{font-size:26px}header em{color:#f0c52b;font-style:normal}.top{padding:10px 15px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd}.pill{border:1px solid #d8d0c5;border-radius:22px;padding:9px 13px;background:#fff;font-weight:800}.red{background:#b80e19;color:#fff}.wrap{padding:12px 14px 40px}.status,.group{background:#fff;border:1px solid #ddd4c7;border-radius:11px;padding:9px;margin-bottom:8px}.status{background:#fff3cf;border-color:#e4ca70}.group-title{font-size:12px;font-weight:900;color:#756f67;margin-bottom:6px}.cands{display:flex;flex-wrap:wrap;gap:6px}.cand{flex:0 0 205px;min-width:180px;border:1px solid #d8d0c5;border-radius:9px;padding:7px 8px;background:#fff}.cand strong{display:block;font-size:14px}.cand small{font-size:11px;color:#756f67}.n{font-size:17px;font-weight:900;color:#b80e19;margin-top:4px}@media(max-width:600px){.cand{flex:1 1 145px;min-width:135px}}</style></head><body><header><b>MAPA DOS VOTOS <em>PCB-SP</em></b><div>RIO GRANDE DO SUL • 2024</div></header><div class="top"><button class="pill" onclick="location.href='/mapa/'">← VOLTAR</button><button class="pill " onclick="location.href='/mapa/rs/2018/'">RS · 2018</button><button class="pill " onclick="location.href='/mapa/rs/'">RS · 2022</button><button class="pill red" onclick="location.href='/mapa/rs/2024/'">RS · 2024</button></div><main class="wrap"><div class="status" id="status">Dados oficiais TSE 2024</div><div id="groups"></div></main><script>const fmt=n=>new Intl.NumberFormat("pt-BR").format(n);fetch("dados.json").then(r=>r.json()).then(D=>{let by={};D.candidatos.forEach(c=>(by[c.municipio]??=[]).push(c));document.getElementById("status").textContent="Dados oficiais TSE 2024 • "+Object.keys(by).length+" município(s) com candidatura PCB";document.getElementById("groups").innerHTML=Object.keys(by).sort().map(m=>'<section class="group"><div class="group-title">'+m+'</div><div class="cands">'+by[m].map(c=>'<div class="cand"><strong>'+c.nome+'</strong><small>'+c.cargo+' • PCB '+c.numero+'</small><div class="n">'+fmt(c.total)+' votos</div></div>').join("")+'</div></section>').join("")}).catch(e=>document.getElementById("status").textContent="Erro ao carregar: "+e.message)</script></body></html>
