<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa dos Votos PCB-SP · MG · TESTE</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3eee4;color:#191817}header{background:#79090f;color:#fff;padding:20px 26px;border-bottom:6px solid #f0c52b}header b{font-size:28px}header em{color:#f0c52b;font-style:normal}.bar{background:#fff;padding:11px 18px;border-bottom:1px solid #ddd}.bar button{padding:10px 15px;border:1px solid #ccc;border-radius:24px;background:#fff;font-weight:bold;cursor:pointer}.status{padding:10px 18px;background:#fff3cf;font-weight:bold}.grid{padding:16px;display:grid;grid-template-columns:1.45fr .55fr;gap:15px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}.hd{padding:14px 16px;border-bottom:1px solid #ddd}.hd h1{margin:0;font-size:24px}.hd small{color:#666}#map{height:590px}.search{padding:10px}.search input{width:100%;font-size:17px;padding:11px;border:1px solid #ccc;border-radius:9px}#cities{height:535px;overflow:auto}.city{padding:9px 12px;border-top:1px solid #eee;font-weight:bold;cursor:pointer}.city:hover{background:#fff3cf;color:#8d0810}@media(max-width:800px){.grid{grid-template-columns:1fr}#map{height:420px}#cities{height:300px}}</style></head><body><header><b>MAPA DOS VOTOS <em>PCB-SP</em></b><div>TERRITÓRIO • HISTÓRIA • ELEIÇÕES</div></header><div class="bar"><button onclick="location.href='/mapa/'">← SÃO PAULO</button> &nbsp; <b>MINAS GERAIS · TESTE BASE SP</b></div><div id="status" class="status">Carregando a mesma estrutura municipal usada no SP 2026…</div><main class="grid"><section class="card"><div class="hd"><h1>Minas Gerais</h1><small>Mapa municipal · códigos IBGE ligados à configuração TSE</small></div><div id="map"></div></section><section class="card"><div class="hd"><h1>Municípios</h1><small id="count">carregando…</small></div><div class="search"><input id="q" placeholder="Buscar município"></div><div id="cities"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,geo,rows=[],byIbge=new Map(),layers=new Map();
function render(a){let b=document.getElementById('cities');b.innerHTML='';a.forEach(m=>{let d=document.createElement('div');d.className='city';d.textContent=m.nm;d.onclick=()=>focus(m);b.appendChild(d)})}
function focus(m){let l=layers.get(m.cdi);if(l){map.fitBounds(l.getBounds(),{padding:[25,25]});l.openPopup()}}
async function init(){try{let [cr,gr]=await Promise.all([fetch('/mapa/dados/2026/mg/municipios-config.json?spbase=1',{cache:'no-store'}),fetch('/mapa/dados/2026/mg/municipios.geojson?spbase=1',{cache:'no-store'})]);if(!cr.ok||!gr.ok)throw Error('arquivos locais '+cr.status+'/'+gr.status);let cfg=await cr.json(),gj=await gr.json();rows=cfg.municipios;rows.forEach(x=>byIbge.set(String(x.cdi),x));map=L.map('map');geo=L.geoJSON(gj,{style:{color:'#fff',weight:.65,fillColor:'#d1c8bb',fillOpacity:1},onEachFeature:(f,l)=>{let id=String(f.properties.id),m=byIbge.get(id);if(m){layers.set(id,l);l.bindPopup('<b>'+m.nm+'</b><br>Código TSE '+m.cd+' · IBGE '+m.cdi+'<br>Zona(s): '+m.z.join(', '))}}}).addTo(map);map.fitBounds(geo.getBounds());render(rows);document.getElementById('count').textContent=rows.length+' municípios';document.getElementById('status').textContent='✓ BASE SP REPLICADA: '+rows.length+' municípios TSE ligados à malha de Minas.'}catch(e){document.getElementById('status').textContent='ERRO: '+e.message}}
document.getElementById('q').oninput=e=>{let q=e.target.value.toLocaleLowerCase('pt-BR');render(rows.filter(x=>x.nm.toLocaleLowerCase('pt-BR').includes(q)))};init();</script></body></html>
