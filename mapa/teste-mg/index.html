<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa dos Votos PCB-SP · MG · TESTE V04</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>:root{--r:#8d0810;--y:#f0c52b;--bg:#f3eee4;--paper:#fffdf8;--line:#ded6c9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#191817}.head{background:linear-gradient(90deg,#65070c,#8d0810);color:white;padding:22px 28px;border-bottom:6px solid var(--y)}.head b{font-size:28px}.head em{color:var(--y);font-style:normal}.bar{padding:12px 20px;background:white;border-bottom:1px solid var(--line);display:flex;gap:10px}.btn{border:1px solid var(--line);background:white;border-radius:24px;padding:10px 15px;font-size:16px;font-weight:bold;cursor:pointer}.btn.on{background:var(--r);color:white}.wrap{padding:18px;display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden}.title{padding:15px 17px;border-bottom:1px solid var(--line)}.title h1{margin:0;font-size:25px}.title small{color:#6d6964}#mgmap{height:560px;background:#e7e0d5}.tools{padding:12px}.tools input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px}#list{height:510px;overflow:auto}.city{padding:10px 13px;border-bottom:1px solid #eee;font-weight:bold;cursor:pointer}.city:hover,.city.on{background:#fff0bd;color:var(--r)}.status{padding:10px 18px;background:#fff3cf;font-weight:bold}@media(max-width:800px){.wrap{grid-template-columns:1fr}#mgmap{height:420px}#list{height:300px}}</style></head><body>
<header class="head"><b>MAPA DOS VOTOS <em>PCB-SP</em></b><div>TERRITÓRIO • HISTÓRIA • ELEIÇÕES</div></header>
<nav class="bar"><button class="btn" onclick="window.location.href='/mapa/'">← SÃO PAULO</button><button class="btn on">MINAS GERAIS · TESTE V04</button></nav>
<div id="status" class="status">Carregando base local de Minas Gerais…</div>
<main class="wrap"><section class="card"><div class="title"><h1>Minas Gerais</h1><small>853 municípios · malha local do projeto</small></div><div id="mgmap"></div></section>
<section class="card"><div class="title"><h1>Municípios</h1><small>Clique para localizar no mapa</small></div><div class="tools"><input id="q" placeholder="Buscar município…"></div><div id="list"></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,layer,features=[];
function drawList(arr){const box=document.getElementById('list');box.innerHTML='';arr.forEach(f=>{const d=document.createElement('div');d.className='city';d.textContent=f.properties.name;d.onclick=()=>select(f,d);box.appendChild(d)})}
function select(f,d){document.querySelectorAll('.city').forEach(x=>x.classList.remove('on'));if(d)d.classList.add('on');let target=null;layer.eachLayer(l=>{if(l.feature.properties.id===f.properties.id)target=l});if(target){map.fitBounds(target.getBounds(),{padding:[25,25]});target.openPopup()}}
async function init(){try{const r=await fetch('/mapa/dados/2026/mg/municipios.geojson',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const gj=await r.json();features=gj.features.sort((a,b)=>a.properties.name.localeCompare(b.properties.name,'pt-BR'));map=L.map('mgmap',{zoomControl:true});layer=L.geoJSON(gj,{style:{color:'#fff',weight:.65,fillColor:'#cfc7ba',fillOpacity:1},onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.name+'</b><br>MG · código IBGE '+f.properties.id)}).addTo(map);map.fitBounds(layer.getBounds());drawList(features);document.getElementById('status').textContent='✓ Base local carregada: '+features.length+' municípios de Minas Gerais.'}catch(e){document.getElementById('status').textContent='ERRO AO CARREGAR BASE LOCAL: '+e.message}}
document.getElementById('q').addEventListener('input',e=>{const s=e.target.value.toLocaleLowerCase('pt-BR');drawList(features.filter(f=>f.properties.name.toLocaleLowerCase('pt-BR').includes(s)))});
init();</script></body></html>
