<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PCB São Paulo</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3">

  <!-- DESCRIÇÃO -->
  <meta
    name="description"
    content="Aplicativos e ferramentas do PCB São Paulo"
  >

  <meta
    name="theme-color"
    content="#b5121b"
  >

  <!-- WHATSAPP / FACEBOOK / OPEN GRAPH -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PCB São Paulo">
<meta property="og:locale" content="pt_BR">

<meta property="og:url" content="https://pcbsp.com.br/">

<meta property="og:title" content="PCB São Paulo">
<meta property="og:description" content="Aplicativos e ferramentas do PCB São Paulo">

<meta property="og:image" content="https://pcbsp.com.br/preview.png">
<meta property="og:image:secure_url" content="https://pcbsp.com.br/preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PCB São Paulo — Aplicativos e ferramentas">

  <!-- X / TWITTER -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PCB São Paulo">
  <meta
    name="twitter:description"
    content="Aplicativos e ferramentas do PCB São Paulo"
  >
  <meta
    name="twitter:image"
    content="https://pcbsp.com.br/preview.png?v=1"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          145deg,
          #8d0d14 0%,
          #b5121b 55%,
          #760a10 100%
        );

      display: flex;
      justify-content: center;

      padding: 24px;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    /* BANNER */

    .banner {
      width: 100%;
      display: block;

      margin: 0 auto 32px;

      border-radius: 20px;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.35);
    }

    /* TÍTULO DOS APPS */

    .apps-titulo {
      color: #ffd400;

      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;

      margin-bottom: 18px;
    }

    /* CARD */

    .app-card {
      display: block;

      width: 100%;
      max-width: 420px;

      margin: 0 auto;

      background: #ffffff;

      border-radius: 24px;

      padding: 26px 22px;

      text-decoration: none;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 20px 45px
        rgba(0, 0, 0, 0.42);
    }

    .icone {
      width: 190px;
      max-width: 65%;
      height: auto;

      border-radius: 22px;

      margin-bottom: 18px;
    }

    .app-nome {
      color: #111111;

      font-size: 25px;
      font-weight: 900;

      line-height: 1.15;
    }

    .app-descricao {
      color: #555555;

      font-size: 15px;
      line-height: 1.5;

      margin-top: 10px;
    }

    .botao {
      display: block;

      margin-top: 22px;

      background: #b5121b;
      color: #ffffff;

      border-radius: 12px;

      padding: 15px;

      font-size: 16px;
      font-weight: 900;
    }

    .rodape {
      margin-top: 35px;

      color: rgba(255, 255, 255, 0.75);

      font-size: 12px;
    }

    /* CELULAR */

    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .pagina {
        max-width: 100%;
      }

      .banner {
        border-radius: 14px;
        margin-bottom: 26px;
      }

      .app-card {
        padding: 22px 18px;
      }

      .icone {
        width: 170px;
      }

      .app-nome {
        font-size: 22px;
      }

    }

  </style>
</head>


<body>

  <main class="pagina">

    <!-- BANNER PRINCIPAL -->

    <img
      class="banner"
      src="/preview.png"
      alt="PCB São Paulo — Aplicativos e ferramentas"
    >


    <!-- APLICATIVOS -->

    <div class="apps-titulo">
      ACESSE NOSSOS APLICATIVOS
    </div>


    <a
      class="app-card"
      href="https://pcbsp.com.br/recrutamento/"
    >

      <img
        class="icone"
        src="https://pcbsp.com.br/recrutamento/icone-recrutamento.png"
        alt="Recrutamento e Circulismo"
      >

      <div class="app-nome">
        Recrutamento e Circulismo
      </div>

      <div class="app-descricao">
        Acesse o aplicativo de Recrutamento e Circulismo do PCB São Paulo.
      </div>

      <span class="botao">
        ACESSAR APLICATIVO
      </span>

    </a>


    <footer class="rodape">
      PCB São Paulo
    </footer>

  </main>

</body>

</html>
