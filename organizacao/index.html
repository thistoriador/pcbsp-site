/main><iframe id="app" title="Aplicativo de Organização Interna" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://cthntxgopxhbaemgnttn.supabase.co','sb_publishable_1mRxuQ1M3IkESIIK4V9nfw_C5iF2g-e',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const msg=document.getElementById('message'),btn=document.getElementById('enter');async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){msg.textContent='Entre com sua conta da CENTRAL.';return}msg.textContent='Verificando autorizações e carregando o APP2…';const res=await fetch('https://cthntxgopxhbaemgnttn.supabase.co/functions/v1/org-app-secure',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_1mRxuQ1M3IkESIIK4V9nfw_C5iF2g-e','Content-Type':'application/json'},body:'{}'});if(!res.ok){msg.textContent=res.status===403?'Sua conta não está autorizada para Organização Interna.':'Não foi possível carregar o aplicativo (código '+res.status+').';return}const data=await res.json();if(!data.html)throw new Error('Aplicativo não recebido');document.getElementById('app').srcdoc=data.html;document.getElementById('app').style.display='block';document.getElementById('gate').style.display='none'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Autenticando…';try{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;await load()}catch(e){msg.textContent='Acesso não concluído: '+(e.message||'Erro de conexão')}finally{btn.disabled=false}});load().catch(e=>msg.textContent='Erro ao iniciar: '+e.message);</script></body></html>
