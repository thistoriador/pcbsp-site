<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Organização Interna • PCB-SP</title><style>*{box-sizing:border-box}body{margin:0;background:#121820;color:#f5f5f5;font:16px Arial,sans-serif}header{background:#aa0712;padding:18px 22px;font-weight:bold;border-bottom:4px solid #ffd21b}main{max-width:460px;margin:8vh auto;padding:26px;background:#202932;border-radius:14px}h1{margin-top:0}label{display:block;margin:15px 0 5px}input{width:100%;padding:12px;border-radius:6px;border:1px solid #65717b;background:#fff;color:#111;font-size:16px}button{margin-top:20px;padding:12px 20px;border:0;border-radius:7px;background:#ffd21b;color:#111;font-weight:bold;cursor:pointer}p{line-height:1.5}#app{width:100%;height:calc(100dvh - 64px);border:0;display:none}#message{color:#ffdc76}</style></head><body><header>PCB • SÃO PAULO — ORGANIZAÇÃO INTERNA</header><main id="gate"><h1>Primeiro acesso: CENTRAL</h1><p>Entre com sua conta autorizada da CENTRAL. Depois, o aplicativo solicitará seu login interno.</p><form id="form"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="enter" type="submit">Entrar na CENTRAL</button></form><p id="message" role="status"></p><a href="/central-teste/" style="color:#ffd21b">Voltar à CENTRAL</a></main><iframe id="app" title="Aplicativo de Organização Interna" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://cthntxgopxhbaemgnttn.supabase.co','sb_publishable_1mRxuQ1M3IkESIIK4V9nfw_C5iF2g-e',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const msg=document.getElementById('message'),btn=document.getElementById('enter');async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){msg.textContent='Entre com sua conta da CENTRAL.';return}msg.textContent='Verificando autorizações e carregando o APP2…';const res=await fetch('https://cthntxgopxhbaemgnttn.supabase.co/functions/v1/org-app-secure',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_1mRxuQ1M3IkESIIK4V9nfw_C5iF2g-e','Content-Type':'application/json'},body:'{}'});if(!res.ok){msg.textContent=res.status===403?'Sua conta não está autorizada para Organização Interna.':'Não foi possível carregar o aplicativo (código '+res.status+').';return}const data=await res.json();if(!data.html)throw new Error('Aplicativo não recebido');document.getElementById('app').srcdoc=data.html;document.getElementById('app').style.display='block';document.getElementById('gate').style.display='none'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Autenticando…';try{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;await load()}catch(e){msg.textContent='Acesso não concluído: '+(e.message||'Erro de conexão')}finally{btn.disabled=false}});load().catch(e=>msg.textContent='Erro ao iniciar: '+e.message);</script></body></html>
