name: Gerar mapa Maranhão 2026
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tse-2026-ma.yml']
permissions: {contents: write}
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Coletar TSE e IBGE
        shell: python
        run: |
          import json,urllib.request,pathlib,unicodedata,time,gzip
          from concurrent.futures import ThreadPoolExecutor
          out=pathlib.Path("mapa/dados/2026/ma");out.mkdir(parents=True,exist_ok=True)
          H={"User-Agent":"Mozilla/5.0"}
          def get(url):
            for i in range(5):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30) as r:
                  raw=r.read()
                  if len(raw)>1 and raw[0]==31 and raw[1]==139: raw=gzip.decompress(raw)
                  return json.loads(raw.decode("utf-8"))
              except Exception:
                if i==4: raise
                time.sleep(2+i)
          def norm(s):return ''.join(c for c in unicodedata.normalize("NFD",str(s).upper()) if unicodedata.category(c)!="Mn")
          cfg=get("https://resultados.tse.jus.br/oficial/ele2026/6259/config/mun-e006259-cm.json")
          ma=next(x for x in cfg["abr"] if x["cd"]=="ma")
          if len(ma["mu"])!=217: raise Exception(f"Esperados 217 municípios, TSE trouxe {len(ma['mu'])}")
          json.dump({"ele":"6259","uf":"ma","estado":"MARANHÃO","municipios":ma["mu"]},open(out/"municipios-config.json","w"),ensure_ascii=False,separators=(",",":"))
          gj=get("https://servicodados.ibge.gov.br/api/v3/malhas/estados/21?formato=application/vnd.geo%2Bjson&qualidade=minima&intrarregiao=municipio")
          json.dump(gj,open(out/"municipios.geojson","w"),ensure_ascii=False,separators=(",",":"))
          wanted={
            "0001":{"EDMILSON COSTA"},
            "0003":{"REGINALDO LIMA"},
            "0005":{"RAIMUNDO MOREIRA"},
            "0007":{"CAETANO COSTA","ROMILDA"}
          }
          cargos={"0001":("6257","Presidente"),"0003":("6259","Governador"),"0005":("6259","Senador"),"0007":("6259","Deputado Estadual")}
          cands={}
          for cargo,(ele,rotulo) in cargos.items():
            d=get(f"https://resultados.tse.jus.br/oficial/ele2026/{ele}/dados/ma/ma-c{cargo}-e00{ele}-u.json")
            def walk(x):
              if isinstance(x,dict):
                nm=x.get("nmu")
                if nm and norm(nm) in wanted[cargo] and x.get("vap") is not None:
                  canon=norm(nm)
                  cands[canon]={"nome":str(nm).upper(),"cargo":rotulo,"numero":str(x.get("n") or x.get("nr") or ""),"total":int(x.get("vap") or 0),"cargo_codigo":cargo,"ele":ele}
                for v in x.values():walk(v)
              elif isinstance(x,list):
                for v in x:walk(v)
            walk(d)
          expected={"EDMILSON COSTA","REGINALDO LIMA","RAIMUNDO MOREIRA","CAETANO COSTA","ROMILDA"}
          missing=expected-set(cands)
          if missing: raise Exception("Candidatos PCB não encontrados no TSE: "+", ".join(sorted(missing)))
          ordem=["EDMILSON COSTA","REGINALDO LIMA","RAIMUNDO MOREIRA","CAETANO COSTA","ROMILDA"]
          json.dump([cands[k] for k in ordem],open(out/"candidatos.json","w"),ensure_ascii=False,separators=(",",":"))
          groups={}
          for k,c in cands.items():groups.setdefault((c["cargo_codigo"],c["ele"]),[]).append((k,c["nome"]))
          def municipio(m):
            row={"codigo_tse":m["cd"],"codigo_ibge":m["cdi"],"municipio":m["nm"],"candidatos":{}}
            for (cargo,ele),ws in groups.items():
              d=get(f"https://resultados.tse.jus.br/oficial/ele2026/{ele}/dados/ma/ma{m['cd']}-c{cargo}-e00{ele}-u.json")
              def walk(x):
                if isinstance(x,dict):
                  nm=norm(x.get("nmu",""))
                  for key,canon in ws:
                    if nm==key and x.get("vap") is not None: row["candidatos"][canon]=int(x.get("vap") or 0)
                  for v in x.values():walk(v)
                elif isinstance(x,list):
                  for v in x:walk(v)
              walk(d)
            for c in cands.values():row["candidatos"].setdefault(c["nome"],0)
            return row
          with ThreadPoolExecutor(max_workers=8) as ex: rows=list(ex.map(municipio,ma["mu"]))
          if len(rows)!=217:raise Exception(f"Esperados 217 municípios, obtidos {len(rows)}")
          for c in cands.values():
            s=sum(r["candidatos"].get(c["nome"],0) for r in rows)
            if s!=c["total"]:raise Exception(f"Total divergente {c['nome']}: municípios {s}, estado {c['total']}")
          rows.sort(key=lambda r:r["municipio"])
          json.dump(rows,open(out/"municipios-interesse.json","w"),ensure_ascii=False,separators=(",",":"))
          print("VALIDADO 217 municípios")
          print(json.dumps([cands[k] for k in ordem],ensure_ascii=False))
      - name: Commit dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/dados/2026/ma
          git diff --cached --quiet || (git commit -m "Maranhão 2026: dados municipais TSE e malha IBGE" && git push)
