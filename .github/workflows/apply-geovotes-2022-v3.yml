name: Apply geovotes 2022 v3
on:
  push:
    paths:
      - '.github/scripts/geovotes-v3-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/patch-geovotos-2022-v3.js
      - run: grep -q "locMapAll" mapa/teste-estadual/index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mapa/teste-estadual/index.html
          git commit -m "Exibe votos georreferenciados em todas as zonas"
          git push
