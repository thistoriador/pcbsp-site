name: Integrar estados 2018 ao menu oficial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-official-mobile-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar somente menus de outros estados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("mapa/index.html")
          s=p.read_text(encoding="utf-8")
          old=s
          states=[
            ("ac","AC","Acre","2026"),("al","AL","Alagoas","2018"),("ap","AP","Amapá","2018"),
            ("ba","BA","Bahia","2022"),("ce","CE","Ceará","2018 · 2022"),("df","DF","Distrito Federal","2018 · 2022"),
            ("es","ES","Espírito Santo","2018"),("go","GO","Goiás","2018 · 2022"),("ma","MA","Maranhão","2018 · 2022 · 2026"),
            ("mg","MG","Minas Gerais","2018 · 2022 · 2026"),("pa","PA","Pará","2018"),("pe","PE","Pernambuco","2018 · 2022"),
            ("pi","PI","Piauí","2018 · 2022"),("pr","PR","Paraná","2022"),("rj","RJ","Rio de Janeiro","2018 · 2022"),
            ("rr","RR","Roraima","2018"),("rs","RS","Rio Grande do Sul","2018 · 2022"),("sc","SC","Santa Catarina","2018")
          ]
          mobile="\n".join(f'    <a href="/mapa/{slug}/">{uf}<small>{years}</small></a>' for slug,uf,name,years in states)
          a=s.index('<div class="ms-grid">')
          b=s.index('</div>',a)
          s=s[:a]+'<div class="ms-grid">\n'+mobile+'\n  '+s[b:]
          desktop="".join(f'<button onclick="location.href=\'/mapa/{slug}/\'" style="padding:8px 10px">{uf} · {name} <small>({years})</small></button>' for slug,uf,name,years in states)
          marker='<div id="estadosMenu" style="display:none;padding:0 0 6px 32px">'
          a=s.index(marker); b=s.index('</div>',a)
          s=s[:a]+marker+desktop+s[b:]
          assert 'let year=2026,candidates=[]' in s
          assert s.count('id="mobileStatesOfficialBtn"')==1
          for slug,uf,name,years in states:
            assert f'/mapa/{slug}/' in s
          if s==old: raise SystemExit("ABORT: sem alterações")
          p.write_text(s,encoding="utf-8")
          print("OK",len(old.encode()),"->",len(s.encode()))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: integrar estados PCB 2018 ao menu principal"
          git push
