name: Corrigir menu Outros Estados

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-official-mobile-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover submenu lateral antigo e usar painel flutuante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("mapa/index.html")
          s=p.read_text(encoding="utf-8"); old=s
          # O botão da sidebar não expande mais a lista dentro da própria sidebar.
          pat=r'<button onclick="toggleEstados\(\)"><span>◆</span> OUTROS ESTADOS <span id="estadosSeta">▾</span></button><div id="estadosMenu" style="display:none;padding:0 0 6px 32px">.*?</div>'
          repl='<button id="desktopStatesOfficialBtn" type="button"><span>◆</span> OUTROS ESTADOS <span>▸</span></button>'
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f"ABORT: menu lateral antigo encontrado {n} vezes")
          # O painel oficial já existente passa a servir desktop e mobile.
          s=s.replace('#mobileStatesOfficialBtn,#mobileStatesOfficialPanel{display:none}',
                      '#mobileStatesOfficialBtn{display:none}#mobileStatesOfficialPanel{display:none}',1)
          css='''
@media(min-width:981px){
 #mobileStatesOfficialPanel{position:fixed;display:none;left:292px;top:76px;bottom:auto;width:min(640px,calc(100vw - 320px));max-height:calc(100vh - 100px);overflow:auto;z-index:9999;background:#fffaf1;border:2px solid #65070c;border-radius:16px;padding:14px;box-shadow:0 10px 32px #0007}
 #mobileStatesOfficialPanel.open{display:block}
 #mobileStatesOfficialPanel .ms-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#65070c;font:900 18px/1.1 Arial,sans-serif}
 #mobileStatesOfficialPanel .ms-close{border:0;background:#65070c;color:#fff;border-radius:10px;padding:7px 11px;font-weight:900}
 #mobileStatesOfficialPanel .ms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 #mobileStatesOfficialPanel a{display:flex;min-height:54px;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;background:#f0ebe2;border:1px solid #d5cec2;border-radius:11px;color:#1b1b1b;font:900 15px/1.05 Arial,sans-serif}
 #mobileStatesOfficialPanel a small{font-size:11px;font-weight:700;color:#6a625a;margin-top:4px}
}
'''
          marker='@media(max-width:980px){'
          if marker not in s: raise SystemExit('ABORT: CSS mobile não localizado')
          s=s.replace(marker,css+marker,1)
          oldjs="(()=>{const b=document.getElementById('mobileStatesOfficialBtn'),p=document.getElementById('mobileStatesOfficialPanel'),c=p&&p.querySelector('.ms-close');if(!b||!p)return;const set=v=>{p.classList.toggle('open',v);p.setAttribute('aria-hidden',String(!v));b.setAttribute('aria-expanded',String(v))};b.addEventListener('click',()=>set(!p.classList.contains('open')));c&&c.addEventListener('click',()=>set(false));})();"
          newjs="(()=>{const m=document.getElementById('mobileStatesOfficialBtn'),d=document.getElementById('desktopStatesOfficialBtn'),p=document.getElementById('mobileStatesOfficialPanel'),c=p&&p.querySelector('.ms-close');if(!p)return;const set=v=>{p.classList.toggle('open',v);p.setAttribute('aria-hidden',String(!v));m&&m.setAttribute('aria-expanded',String(v));d&&d.setAttribute('aria-expanded',String(v))};m&&m.addEventListener('click',()=>set(!p.classList.contains('open')));d&&d.addEventListener('click',()=>set(!p.classList.contains('open')));c&&c.addEventListener('click',()=>set(false));})();"
          if oldjs not in s: raise SystemExit('ABORT: JS oficial não localizado')
          s=s.replace(oldjs,newjs,1)
          assert 'id="estadosMenu"' not in s
          assert 'id="desktopStatesOfficialBtn"' in s
          assert 'let year=2026,candidates=[]' in s
          for uf in ['al','ap','ce','df','es','go','ma','mg','pa','pe','pi','rj','rr','rs','sc']:
            assert f'/mapa/{uf}/' in s
          p.write_text(s,encoding='utf-8')
          print('OK',len(old.encode()),'->',len(s.encode()))
          PY
      - name: Commit correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/index.html
          git diff --cached --check
          git commit -m "fix: evitar submenu lateral travado em Outros Estados"
          git push
