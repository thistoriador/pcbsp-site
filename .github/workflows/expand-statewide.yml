name: Expand statewide geometry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/expand-statewide.js'
      - '.github/workflows/expand-statewide.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Expand municipal GeoJSON files
        run: node .github/scripts/expand-statewide.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/teste-estadual
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publica geometria estadual por municipio"
          git push
