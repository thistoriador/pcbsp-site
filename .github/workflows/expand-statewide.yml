name: Expand statewide geometry
on:
  push:
    paths:
      - '.github/scripts/expand-statewide.js'
      - '.github/workflows/expand-statewide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/expand-statewide.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/teste-estadual
          git commit -m "Publica geometria estadual por municipio" || exit 0
          git push
