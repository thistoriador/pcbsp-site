name: Build TSE 2022 polling places
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/build-locais-2022.js'
      - '.github/workflows/build-locais-2022.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/build-locais-2022.js
      - name: Verify
        run: |
          test $(find mapa/teste-estadual/locais -name '*.json' | wc -l) -eq 645
          test -s mapa/teste-estadual/locais/campinas.json
          test -s mapa/teste-estadual/locais/sao-paulo.json
          test -s mapa/teste-estadual/locais/franca.json
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mapa/teste-estadual/locais
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona locais de votação TSE 2022 por município"
          git push
