name: Build TSE 2022 polling places retry
on:
  push:
    paths:
      - '.github/scripts/rebuild-locais-2022.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/build-locais-2022.js
      - run: |
          test $(find mapa/teste-estadual/locais -name '*.json' | wc -l) -eq 645
          test -s mapa/teste-estadual/locais/campinas.json
          test -s mapa/teste-estadual/locais/sao-paulo.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mapa/teste-estadual/locais
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona locais de votação TSE 2022 por município"
          git push
