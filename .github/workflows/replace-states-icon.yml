name: Replace states icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-states-icon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mapa/index.html")
          s=p.read_text(encoding="utf-8")
          old=s
          # troca apenas o losango associado ao texto OUTROS ESTADOS
          s=s.replace("<span>◆</span> OUTROS ESTADOS","<span>🇧🇷</span> OUTROS ESTADOS")
          s=s.replace("<span>♦</span> OUTROS ESTADOS","<span>🇧🇷</span> OUTROS ESTADOS")
          s=s.replace("◆ OUTROS ESTADOS","🇧🇷 OUTROS ESTADOS")
          s=s.replace("♦ OUTROS ESTADOS","🇧🇷 OUTROS ESTADOS")
          if s==old: raise SystemExit("icone alvo nao encontrado")
          p.write_text(s,encoding="utf-8")
          print("OK",s.count("🇧🇷"))
          PY
      - run: |
          grep -q "🇧🇷.*OUTROS ESTADOS" mapa/index.html
          ! grep -q "◆.*OUTROS ESTADOS" mapa/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/index.html
          git diff --cached --check
          git commit -m "style: use Brazil icon for other states"
          git push
