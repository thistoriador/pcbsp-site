name: Baixar resultados TSE 2026 SP — urgente
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tse-2026-sp.yml'
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar resultados oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapa/dados/2026/sp
          curl --fail --retry 3 -A "Mozilla/5.0" "https://resultados.tse.jus.br/oficial/ele2026/6259/config/mun-e006259-cm.json" -o mapa/dados/2026/sp/municipios-config.json
          python -m json.tool mapa/dados/2026/sp/municipios-config.json >/dev/null
          base="https://resultados.tse.jus.br/oficial/ele2026/6259/dados/sp"
          for cargo in 0003 0005 0006 0007; do
            url="$base/sp-c$cargo-e006259-u.json"
            echo "$url"
            curl --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$url" -o "mapa/dados/2026/sp/c$cargo.json"
            python -m json.tool "mapa/dados/2026/sp/c$cargo.json" >/dev/null
          done
          curl --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://resultados.tse.jus.br/oficial/ele2026/6257/dados/sp/sp-c0001-e006257-u.json" -o "mapa/dados/2026/sp/c0001.json"
          python -m json.tool "mapa/dados/2026/sp/c0001.json" >/dev/null
      - name: Gerar votação municipal das candidaturas acompanhadas
        shell: python
        run: |
          import json, pathlib, urllib.request, time, unicodedata
          base=pathlib.Path("mapa/dados/2026/sp")
          cfg=json.load(open(base/"municipios-config.json"))
          sp=next(x for x in cfg["abr"] if x["cd"]=="sp")
          alvos={
            "EDMILSON COSTA":("0001","6257"),"CARLOS MACHADO":("0003","6259"),
            "PETTER MAAHS":("0005","6259"),"NATÁLIA BOULOS":("0006","6259"),
            "FABIO MELLO":("0006","6259"),"JOÃO PAULO RILLO":("0007","6259"),
            "PROFESSORA PRISCILA":("0007","6259"),"DÉBORA CAMILO":("0007","6259")}
          def norm(s):
            return ''.join(c for c in unicodedata.normalize("NFD",str(s).upper()) if unicodedata.category(c)!="Mn")
          wanted={norm(k):(k,c,e) for k,(c,e) in alvos.items()}
          out=[]
          headers={"User-Agent":"Mozilla/5.0"}
          for i,m in enumerate(sp["mu"],1):
            row={"codigo_tse":m["cd"],"codigo_ibge":m["cdi"],"municipio":m["nm"],"candidatos":{}}
            for cargo,ele in [("0001","6257"),("0003","6259"),("0005","6259"),("0006","6259"),("0007","6259")]:
              url=f"https://resultados.tse.jus.br/oficial/ele2026/{ele}/dados/sp/sp{m['cd']}-c{cargo}-e00{ele}-u.json"
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:d=json.load(r)
              except Exception as e:
                row.setdefault("erros",[]).append({"cargo":cargo,"erro":str(e)});continue
              def walk(x):
                if isinstance(x,dict):
                  nm=norm(x.get("nmu",""))
                  if nm in wanted and "vap" in x:
                    canon,_,_=wanted[nm];row["candidatos"][canon]=int(x.get("vap") or 0)
                  for v in x.values():walk(v)
                elif isinstance(x,list):
                  for v in x:walk(v)
              walk(d)
              time.sleep(.015)
            out.append(row)
            if i%50==0: print(i,"/",len(sp["mu"]))
          json.dump(out,open(base/"municipios-interesse.json","w"),ensure_ascii=False,separators=(",",":"))
          print("municípios:",len(out),"com dados:",sum(bool(x["candidatos"]) for x in out))
      - name: Resumo dos candidatos de interesse
        shell: python
        run: |
          import json, pathlib, unicodedata
          base=pathlib.Path("mapa/dados/2026/sp")
          wanted=["PCB","EDMILSON COSTA","CARLOS MACHADO","PETTER MAAHS","NATALIA BOULOS","FÁBIO MELLO","FABIO MELLO","JOÃO PAULO RILLO","JOAO PAULO RILLO","PRISCILA CINTRA","PROFESSORA PRISCILA","DÉBORA CAMILO","DEBORA CAMILO"]
          def norm(s):
            return ''.join(c for c in unicodedata.normalize('NFD',str(s).upper()) if unicodedata.category(c)!='Mn')
          out=[]
          for p in base.glob("c*.json"):
            d=json.load(open(p))
            def walk(x):
              if isinstance(x,dict):
                blob=" ".join(str(v) for v in x.values() if isinstance(v,(str,int,float)))
                nb=norm(blob)
                if any(norm(w) in nb for w in wanted): out.append({"arquivo":p.name,**x})
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(d)
          json.dump(out,open(base/"interesse.json","w"),ensure_ascii=False,indent=2)
          print("registros de interesse:",len(out))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/dados/2026/sp
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza apuração TSE 2026 SP"
          git push
