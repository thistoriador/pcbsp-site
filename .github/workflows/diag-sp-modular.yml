name: Diagnosticar SP modular
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diag-sp-modular.yml']
permissions:
  contents: write
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analisar index SP
        shell: python
        run: |
          import re,json,pathlib
          p=pathlib.Path("mapa/index.html")
          s=p.read_text(encoding="utf-8")
          scripts=re.findall(r'<script([^>]*)>([\\s\\S]*?)</script>',s,re.I)
          srcs=re.findall(r"<script[^>]+src=[\\\"']([^\\\"']+)",s,re.I)
          years={y:s.count(y) for y in ["2010","2014","2018","2020","2022","2024","2026"]}
          needles={}
          for n in ["JOÃO PAULO RILLO","FABIO JOSE RODRIGUES DE MELLO","FABIO JOSÉ RODRIGUES DE MELLO","50123","5013","const DATA","let DATA","var DATA","GeoJSON","FeatureCollection","HQ"]:
            pos=[m.start() for m in re.finditer(re.escape(n),s,re.I)]
            needles[n]=pos[:20]
          inline=[{"attrs":a.strip(),"chars":len(b),"head":b[:180].replace("\n"," ")} for a,b in scripts]
          contexts={}
          for label,pos in [("rillo",712855),("geo",706516),("hq",9076)]:
            contexts[label]=s[max(0,pos-1800):pos+2800]
          tags=[]
          for m in re.finditer(r'<(script|style|template|textarea|pre|div)[^>]*',s,re.I):
            tags.append({"tag":m.group(1),"pos":m.start(),"head":m.group(0)[:240]})
          out={"bytes":len(s.encode()),"chars":len(s),"script_srcs":srcs,"inline_scripts":inline,"years":years,"needles":needles,"contexts":contexts,"tags_near_data":[x for x in tags if 680000<x["pos"]<740000]}
          pathlib.Path("mapa/diag-sp-modular.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          # Criar cópia de teste e externalizar imagens data:image
          import base64
          test=s
          outdir=pathlib.Path("mapa/sp-modular")
          assets=outdir/"assets"; assets.mkdir(parents=True,exist_ok=True)
          imgs=list(re.finditer(r'data:image/(jpeg|png);base64,([A-Za-z0-9+/=]+)',test))
          for i,m in reversed(list(enumerate(imgs,1))):
            ext="jpg" if m.group(1)=="jpeg" else "png"
            raw=base64.b64decode(m.group(2))
            fn=f"embedded-{i}.{ext}"
            (assets/fn).write_bytes(raw)
            test=test[:m.start()]+"assets/"+fn+test[m.end():]
          (outdir/"index.html").write_text(test,encoding="utf-8")
          (outdir/"size-report.json").write_text(json.dumps({"original_bytes":len(s.encode()),"modular_test_bytes":len(test.encode()),"embedded_images":len(imgs),"saved_bytes":len(s.encode())-len(test.encode())},indent=2),encoding="utf-8")
      - name: Commit diagnóstico
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mapa/diag-sp-modular.json mapa/sp-modular
          git diff --cached --quiet || (git commit -m "Diagnostica modularização SP" && git push)
