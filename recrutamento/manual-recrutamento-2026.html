<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Manual Nacional de Recrutamento — PCB (2026)</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;max-width:800px;margin:35px auto;padding:0 20px;color:#202020}pre{white-space:pre-wrap;font:15px/1.65 Arial,sans-serif}button{background:#a70e1c;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}</style></head><body><button onclick="window.print()">Imprimir / Salvar em PDF</button><pre id="manual"></pre><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>const manual="MANUAL DE RECRUTAMENTO\nCrescer com qualidade e recrutar com ousadia\nO PCB encontra-se num momento em que necessita adotar uma política planejada e mais\nousada no sentido do crescimento da nossa organização de maneira segura e com\nqualidade. Em função da construção de uma linha política revolucionária, sem concessões\ncom a conciliação de classes nem com o esquerdismo, o Partido acumulou êxitos, despertou\nsimpatias, ganhando autoridade política junto a vastos setores dos/as lutadores/as sociais,\nda juventude e da esquerda brasileira. Nos últimos anos muitos ativistas e militantes sociais\ne políticos de vários Estados do país procurando o Partido para se organizar e militar.\nNo entanto, a recente crise provocada pelo racha em 2023 e o desgaste das relações\ninternas e de uma ação militante por vezes exaustiva causou o afastamento de muitos e\nmuitas camaradas. Para podermos influir de forma decisiva e com mais intensidade na\nconjuntura atual, marcada pelo crescimento da extrema-direita e pela hegemonia do campo\ndemocrático e popular na esquerda brasileira, será preciso encarar de frente estes\nproblemas e adotar uma política muito bem estruturada e debatida com profundidade entre\nnossos/as militantes, para desenvolver o nosso crescimento orgânico.\nO recrutamento de novos e novas militantes é essencial para a realização do projeto político\ndo PCB, que luta pela superação revolucionária do capitalismo e pela construção do\nSocialismo no Brasil. Por ser um partido de luta regido pelo princípio do centralismo\ndemocrático, um partido de militantes com potencial de se transformarem em quadros\npolíticos, atuando nas condições atuais de acirramento da luta de classes e de ataques às\nliberdades democráticas, e não um partido de filiados, nem partido de massas, é necessário\nque o recrutamento se dê com critérios objetivos e passos bem definidos.\nPara construir o Partido enquanto ferramenta verdadeiramente revolucionária, precisamos\nalmejar crescer com ousadia, mas sem deixar de primar pela qualidade nesse crescimento. A\ninteração dialética entre o crescimento e o caráter marxista-leninista do Partido deve nos\nguiar. A política nacional de recrutamento deve ser bem planejada, com objetivos precisos,\nmetas bem definidas e responsabilidades estabelecidas.\nEm se tratando de uma campanha nacional, os/as assistentes do Comitê Central em cada\nEstado terão um papel fundamental de incentivo às direções estaduais, bem como no\nestabelecimento de planos e metas de recrutamento de acordo com a realidade de cada\nregião. Todos os CRs devem estabelecer planos, metas e responsabilidades na campanha.\nAs ações voltadas para o recrutamento devem ser acompanhadas de uma sólida política de\nformação para os novos membros do Partido. Todos/as os/as novos/as militantes devem\npassar pelo curso de iniciação partidária, de forma a compreender o que é o Partido, como\nfunciona a estrutura partidária e quais os seus objetivos estratégicos e táticos. Acreditamos\nque o Partido é o local mais adequado para formar a militância e socializar a cultura\ncomunista.\nFundamentos para a política de recrutamento\nO Regimento Interno do PCB, aprovado na Conferência Política concluída no ano de 2024,\ndefine, em seu Inciso X, as seguintes linhas básicas para o necessário processo de\nrecrutamento de novos e novas militantes para o nosso Partido, na perspectiva de um\ncrescimento da organização com qualidade:\nX – Do Recrutamento\nArt. 61. O recrutamento partidário é regulamentado pelo manual de recrutamento organizado\npelo Secretariado Nacional de Organização, que o deverá adequar às diferentes realidades e\ndemandas do Partido nos estados.\n§ 1º Todo CR constituirá uma comissão de recrutamento que estará subordinada, nos\nestados, às secretarias de organização regionais, assistidas pelo Secretariado Nacional de\nOrganização. As comissões de recrutamento devem ter tamanho proporcional ao número de\nrecrutamentos.\n§ 2º Embora o pertencimento ao PCB seja uma união voluntária de militantes, a entrada no\nPartido não é um ato autorreferenciado ou autoproclamado, mas fruto de um recrutamento\nque deverá ser conduzido à luz do manual de recrutamento e dos documentos e resoluções\ndo Partido, pelas células assistidas ou orientadas pelas comissões de recrutamento\nregionais.\nArt. 62. É dever do Partido garantir a formação dos/as novos/as militantes partidários/as, que,\ndurante os primeiros seis meses de militância, deverão fazer o curso de iniciação partidária,\nfocado no funcionamento político e organizativo do Partido, na história do PCB, nos seus\nprincípios teóricos e fundamentos políticos e programáticos.\nA política de recrutamento que iremos desenvolver será baseada nos seguintes princípios,\ntodos constantes de política de organização elaborada em nosso último Congresso e de\nacordo com o Regimento Interno:\n1) Os/as assistentes, em comum acordo com os Comitês Regionais, deverão elaborar planos\ne metas de recrutamento e estabelecer responsabilidades de acordo com a realidade de\ncada Estado.\n2) Deve-se buscar incorporar às fileiras partidárias os/as ativistas do movimento social e\npolítico que estão na luta cotidiana conosco, que tenham simpatia por nossa linha política e\nestejam dispostos a iniciar sua militância no Partido.\n3) Os/as novos/as militantes deverão se organizar numa célula do Partido, após o curso de\niniciação partidária e as conversas prévias feitas no processo de recrutamento.\n4) Deve-se estabelecer, também em comum acordo com a direção nacional e as direções\nestaduais e locais da UJC e da UC, o recrutamento dos/as militantes que estejam em\ncondições e demonstram o desejo de militar no Partido.\n5) É preciso estimular a Unidade Classista, a UJC e os coletivos partidários (Ana Montenegro,\nMinervino de Oliveira, LGBT) a realizar também uma política de recrutamento de novos/as\nmilitantes, visando aumentar o número de camaradas incorporados/as à luta orgânica\ndessas organizações.\nOs Comitês Regionais devem obrigatoriamente se incorporar a essa política. Deverão\ntrabalhar também no sentido da formação de células partidárias tanto nas capitais quanto\nnas cidades com mais de 100 mil habitantes. É fundamental estarmos presentes nas cidades\nmais populosas do país, porque é exatamente nas cidades e, especialmente, nos grandes\ncentros, onde pulsa mais intensamente a luta de classes. Nos Estados onde há Comitês\nMunicipais ou células de base é importante rompermos com a cultura de o Comitê Municipal\nser a própria base do Partido no Município. Deveremos convencer os dirigentes e militantes\nde que o Partido deve crescer nas grandes cidades, formar as células por local de trabalho,\nestudo e moradia, de acordo com a nossa política de organização.\nOs Comitês Municipais, além de ampliar as células comunistas nas cidades, devem\ndesenvolver esforços no sentido de formar também os coletivos, a fim de transformar esses\ncoletivos em instrumentos para a ampliação da influência do Partido nos locais de atuação,\nbem como em escolas de militantes para futuros recrutamentos. As células que já estão\nformadas e em funcionamento deverão se incorporar de maneira ativa a esta política de\nrecrutamento, especialmente entre os trabalhadores, as trabalhadoras e a juventude. Devem\ntambém realizar um trabalho planejado, um plano de ação com objetivos, metas e definição\nde responsabilidades, sempre procurando combinar as lutas sociais e políticas nas ruas, a\nagitação e propaganda nas redes sociais, com uma política de recrutamento.\nConsideramos que chegou a hora de ousarmos no recrutamento, fazendo o Partido crescer\norganicamente, ao mesmo tempo em que devemos manter a vigilância e a qualidade da\nmilitância. Como diz a resolução de nosso Congresso: “Precisamos superar uma fase em\nque só recrutamos parte daqueles que batem à nossa porta. A consolidação de nossa linha\npolítica e o respeito que ela cativa naqueles que se consideram comunistas nos ajuda a\nenfrentar organizadamente esta ousadia, através de uma campanha nacional ... O\nrecrutamento tem que continuar a ser seletivo, mas levando em conta que o recrutando\nconsolidará sua práxis comunista e se formará política e ideologicamente dentro do Partido”.\nO Comitê Central e os Comitês Regionais deverão promover um balanço regular dos\nresultados obtidos com o plano de recrutamento em suas reuniões ordinárias, para termos\num controle das tarefas e das responsabilidades, visando o pleno êxito na construção e\nefetivação dessa política.\nO processo de recrutamento\nA. Quem nos procura:\nHá um significativo número de pessoas que tem procurado o PCB demonstrando interesse\nem ingressar na organização. Explicam esse fato a situação da classe trabalhadora, que\nevidencia as tendências do capitalismo, com o aumento da exploração da força de trabalho,\na precarização das condições de vida e a retirada de direitos, além da situação política, com\na ameaça do crescimento do fascismo; a descaracterização de outras forças políticas que\nse definiam como socialistas e mesmo de esquerda; a recente ascensão de lutas como a luta\npelo fim da jornada 6 x1 e pela redução da jornada de trabalho sem redução salarial, pela\ntaxação maior dos mais ricos e outras; o acerto, em termos gerais, da linha política e dos\nposicionamentos que o PCB vem tendo; a atuação do Partido nos setores mais organizados\nda classe trabalhadora e em movimentos mais amplos, pela difusão de nossas análises e\nproposições, de forma direta e pelas redes sociais; as políticas de alianças adotadas nos\ncampos sindical e eleitoral, assim como nas lutas sociais como um todo, onde temos tido a\niniciativa de criar novos espaços de luta, com destaque para aquelas que nos aproximam\ndas camadas populares. Também contribui para o potencial crescimento do Partido a\natuação de nossos coletivos, que vêm ocupando espaços importantes e atraindo pessoas\npara a militância em suas fileiras.\nEntre as pessoas que nos têm procurado, há diferentes perfis:\n1) Ex-militantes de outras forças de esquerda (PSOL e PT, principalmente);\n2) Ativistas / lutadores sociais que têm referência na esquerda e simpatia pelo PCB e sua\npolítica;\n3) Pessoas, com destaque para jovens, que não têm experiência de militância, mas têm\ninteresse na política e / ou compartilham de ideias socialistas e comunistas em geral e\nacompanham as publicações as ações do PCB e dos seus Coletivos nas redes sociais;\n4) Pessoas que compartilham suas opiniões e interagem, sistematicamente, nas redes\nsociais, demonstrando afinidade com posições e propostas do PCB e pessoas que têm\nreferência na história do Partido;\n5) Militantes dos coletivos partidários que manifestam interesse em ingressar no Partido;\n6) Ex-militantes do PCB que mantêm a referência e se apresentam para ajudar o PCB.\nHá também pessoas que têm interesse em conhecer as posições e análises do Partido e\ndebater conosco temas políticos, mesmo sem ter, inicialmente, a intenção de se tornarem\nmilitantes.\nB. Quem devemos buscar:\nO PCB tem, como orientação, buscar atrair pessoas com perfil e potencial para militar em\nnossas fileiras: os que, observados em sua postura e atuação política na sociedade, nas\náreas em que temos atuação ou influência que demonstram afinidades com nossa linha\npolítica geral ou nos posicionamentos daquela área em particular devem ser convidados pelo\nPartido ou pelos coletivos para, após um processo de recrutamento, ingressar no Partido ou\nnos Coletivos. Merece especial atenção o caso dos “militantes virtuais”, ou seja, aqueles/as\ncuja atuação se restringe ao universo virtual. Estes/as também são possíveis novos/as\nmilitantes, mas devem exigir mais cuidados no recrutamento, pela falta de atuação direta na\nsociedade.\nTemos enfrentado problemas derivados da entrada de pessoas que não tiveram qualquer\nprática de atuação política anterior e não têm nenhum conhecimento da forma de\norganização do Partido, da cultura comunista ou mesmo do que significa fazer luta política de\nforma sistemática.\nHá dois riscos sistêmicos presentes nas ações de recrutamento que devem ser evitados: o\nprimeiro é decorrente de uma visão de partido pequeno, restrito a poucos “quadros”, com\nmuita leitura teórica e experiência de luta. Essa visão leva à perda ou ao retardamento de\nrecrutamentos. A segunda é a visão de um partido mais aberto, próximo do modelo de\npartido de massa, que leva à facilitação da entrada de pessoas que não militam ou não\nentendem o que é militar sistematicamente, ou que vêm de outras organizações que não\natuam de forma constante e disciplinada. Essas duas visões não coadunam com nossas\nresoluções de organização, destoam de nosso projeto de construção revolucionária e da\ndefinição de partido que temos.\nAs dificuldades mais comuns presentes no processo de recrutamento são as de\ncompreensão do funcionamento do Partido, com destaque para o centralismo democrático,\nda exigência de participação constante nas reuniões de células e na realização também\nconstante e sistemática de tarefas e de ações, no plano interno e na base social. Além disso,\nestão presentes também as diferenças culturais em militantes que vêm de outras\norganizações.\nOs procedimentos necessários para o recrutamento\nAssim, para o fortalecimento e unificação do processo de recrutamento e para fazer frente à\ncrescente demanda por novos e novas militantes, devemos seguir os seguintes passos:\nA) Os Comitês Regionais devem formar uma comissão de recrutamento composta por\ndirigentes e militantes mais experientes. As comissões já existentes devem ser reforçadas.\nB) Um novo recrutamento em potencial pode ser identificado pelos CRs ou pelas Células. No\ncaso das Células, o/a assistente deverá comunicar ao CR, com um breve relato sobre o perfil\n/ histórico do/a interessado/a, e acompanhar o processo. É o momento em que convém\nexplicar que o vínculo com o PCB se dá não pela pura e simples filiação cartorial, mas sim\npela militância ativa, exercida em espaços comuns de atuação e luta através das instâncias\nde base do Partido ou de seus coletivos. Deve-se necessariamente conhecer o contato\natravés da obtenção das seguintes respostas:\n1. Como conheceu o PCB e a teoria marxista?\n2. Em que cidade e/ou bairro mora?\n3. Qual a idade, local de trabalho e formação educacional?\n4. Onde gostaria de militar, ou seja, exercer suas atividades políticas (local de estudo,\ntrabalho ou moradia)?\n5. Possui experiência anterior de atuação em alguma organização ou\nmovimento social?\nC) Aqueles/as que se apresentam devem ser recebidos/as por uma comissão da célula\n(idealmente, pelo menos 2 militantes) para um primeiro contato, em que deve ser feita uma\ndefinição do perfil do/a interessado/a para uma primeira triagem. Cabe à instância\nresponsável pelo período de contato fazer uma investigação preliminar sobre a pessoa,\nprocurando conhecer (através das redes sociais ou de conhecidos) se suas intenções são\nverdadeiras. Atenção especial deverá ser tomada com egressos/as de outras organizações,\nporém, sem serem colocados entraves ao processo de recrutamento.\nD) Se o/a interessado/a estiver muito longe do perfil que desejamos – como no caso de\ndeclarações que evidenciem apenas a intenção de ser candidato/a nas eleições ou de\nsimpatia por ideias ou práticas não condizentes com as nossas ou de dúvidas quanto à\nveracidade das informações prestadas, o processo deve ser suspenso ou abortado.\nE) Se o/a interessado/a for considerado em condições de seguir com o recrutamento, o\nprocesso deve ser informado à comissão estadual que acompanhará o processo, e então\nformalmente iniciado. Nesta fase, as resoluções congressuais devem ser debatidas com o/a\nrecrutando/a. Esse debate pode ser feito em grupos.\nF) O/a recrutando/a deverá ser esclarecido/a quanto ao centralismo democrático, à exigência\nde atuação constante, quanto à necessidade de manter a contribuição financeira regular e\ndeverá declarar e demonstrar estar de acordo com tais exigências. A estrutura e as\ndificuldades e limitações do Partido devem ser também apresentadas com franqueza.\nG) Em seguida, o/a recrutando/a deve ser encaminhado/a a um coletivo ou a uma célula do\nPartido. O encaminhamento a um coletivo deve ser prioritário, como regra geral, ou se não\nfor possível, a algum espaço de hegemonia ou forte influência partidária, para\nacompanhamento de sua atuação (ex.: Bloco Comuna que Pariu! – onde estiver organizado,\nCasa da América Latina no Rio, OPA no Ceará, etc).\nH) Entradas diretas nas células devem se dar nos casos de o/a recrutando/a ter boa\nexperiência de militância real junto à base social e em casos já demonstrados de\nconfiabilidade política com o Partido. Se houver casos de impossibilidade de organização via\ncoletivos, ainda que as condições ideais não estejam dadas, a vinculação direta ao Partido\npoderá se dar, mas com acompanhamento do secretariado e da assistência da célula.\nI) Alternativamente, para aqueles/as que desejarem se aproximar do Partido, mas têm pouco\nconhecimento e prática política, pode ser feito um convite para uma “Roda de Conversa” ou\npara a participação em um “círculo político”, uma reunião periódica não vinculada direta e\norganicamente ao Partido, com a presença de um ou mais dirigentes, para o debate de\ntemas políticos e apresentação de nossas formulações a amigos e amigas, simpatizante e\npessoas interessadas em conhecer mais profundamente o PCB.\nJ) As direções regionais e as células devem organizar, periodicamente, reuniões ampliadas,\n“rodas de conversa” e outras atividades abertas a convidados e convidadas, adotando uma\npostura mais ativa no processo de recrutamento e não apenas aguardando que o Partido e\nos Coletivos sejam procurados por pessoas interessadas em se aproximar da nossa\norganização. Também deve ser usada a opção de realização de cursos abertos, como uma\nforma de atração de possíveis militantes e divulgação das nossas ideias.\nK) O Partido deve, portanto, organizar, manter e mesmo priorizar o recrutamento ativo, ou\nseja, estudar e convidar para nossas fileiras companheiros/as ativos/as nas lutas sociais e /\nou que demonstrem afinidade com nossos objetivos estratégicos, nossa política e nossa\nforma de organização. Para tanto, as direções estaduais e as células devem “mapear”\nconstantemente seu campo de atuação e, ao identificar companheiros e companheiras com\no perfil que desejamos, convidá-los/as para fazer parte do PCB e/ou da UC, UJC e Coletivos.\nÉ essencial que o/a novo/a militante tenha de fato um espaço de atuação real nos\nmovimentos sociais existentes.\nL) A formação inicial/básica do/a novo/a militante continuará mesmo encerrado o\nrecrutamento, contemplando o aprofundamento de temas vistos no recrutamento, novos\ntemas, conjuntura, iniciação partidária e conhecimento da estrutura organizativa do PCB. É\ntarefa do Partido e de sua militância garantir a continuidade da formação política e teórica,\nestimulando os estudos individuais e promovendo as atividades coletivas.\nSobre metodologias e materiais\nA metodologia utilizada no recrutamento deve se adequar ao organismo que realiza os\nencontros e a pessoa recrutada, cumprindo os objetivos já listados. Os encontros precisam\nser receptivos e realizados com seriedade, evitando discursos longos e professorais\n(palestras) e priorizando o diálogo em torno dos temas conjunturais, História do PCB,\nconhecimentos básicos do marxismo-leninismo e forma de organização do Partido.\nA metodologia mais comum adotada é a leitura prévia de alguns documentos básicos e a\nposterior discussão sobre os mesmos, tirando dúvidas e aprofundando os temas tratados. O\nuso de recursos visuais, auditivos, audiovisuais e do diálogo auxiliam no processo.\nNos encontros, que deverão ser no mínimo três (ou dois, quando se tratar de pessoa que já\nmilita em um coletivo do PCB) e não poderão ultrapassar cinco — deverão ser enfatizados\ndeterminados eixos, visando direcionar e facilitar o próprio trabalho voltado ao recrutamento.\nTais eixos são os seguintes:\n• História do PCB;\n• Visão do Partido da conjuntura recente (baseando-se nas últimas notas políticas\nnacionais e estaduais);\n• Noções básicas da teoria marxista e do leninismo;\n• Definições de estratégia e tática, e a Estratégia Socialista do PCB;\n• Centralismo democrático;\n• Relação partido-coletivos;\n• Poder popular;\n• Direitos e deveres do militante, presentes no Regimento Interno do PCB, incluindo o\ndever da cotização financeira, que deverá ser enfatizado;\n• Definição do espaço onde o/a militante será inserido/a;\n• Política de comunicação interna: uso de Telegram, Protonmail ou outros\nmecanismos seguros.\nDentre os materiais já disponibilizados pelo Partido e seus coletivos, temos:\nb) Texto/História do PCB: https://pcb.org.br/portal2/658\nc) Texto/O que é o Partido Comunista: https://pcb.org.br/portal/docs/partidocomunista.html\nd) Texto/Manual de Organização partidária: https://pcb.org.br/portal/docs/manual.html\ne) Texto/A Estratégia e a Tática do PCB:\nhttps://drive.google.com/file/d/1F_5SvtoZsxCyfsp6dx1gek0kMYEoDTvX/\nview\nf) Texto/Breve Histórico do PCB: https://pcb.org.br/portal2/29871\ng) Texto/Diversos; Iniciação Partidária: https://pcb.org.br/portal2/659\nh) Texto/Diversos; Clássicos do Marxismo: https://pcb.org.br/portal2/661\ni) Texto/Diversos; Formação Básica: https://pcb.org.br/portal2/247\nj) Texto/Resoluções XVI Congresso do PCB: https://pcb.org.br/portal2/28466\nk) Texto/II Congresso Nacional da UC:\nhttp://unidadeclassista.org.br/download/resolucao-do- 2o-congresso-nacional-daunidade-\nclassista-2018? wpdmdl=4005&masterkey=5dc72c646998e\nl) Texto/IX Congresso UJC: https://ujc.org.br/wp-content/uploads/2024/11/Documentos-\nIX-Congresso-UJC.pdf\nm) Texto/Resoluções CFCAM: https://anamontenegro.org/cfcam/resolucoes/\nn) Texto/Diversos; Biblioteca CNMO:\nhttps://coletivominervinocom.wordpress.com/biblioteca/\no) Texto/Diversos; Formação Básica LGBT\nComunista:\nhttps://lgbtcomunista.org/2021/05/08/formacaobasica/\np) Vídeo/Curso de Iniciação Partidária:\nhttps://www.youtube.com/watch?\nv=OSIIz64fFk4&list=PLpXMt17sAsDiR0lmeBKGH3_i6ZKX-6oSO\nq) Vídeo/Playlist O Poder Popular:\nhttps://www.youtube.com/@JornalOPoderPopular/playlists\nr) Vídeo/Curso Nacional de Formação do PCB:\nMódulo I – O PCB na história política brasileira. Ministrado por Milton Pinheiro\nhttps://www.youtube.com/watch?v=8NkZEkGoi20\nMódulo II – Fundamentos da Crítica da Economia Política. Ministrado por Raquel Azevedo e\nLeonardo Segura - https://www.youtube.com/watch?v=-wVXOQ3lH28\nMódulo III – Classes Sociais, Estado e Revolução. Ministrado por Mauro Iasi\nhttps://www.youtube.com/watch?v=C6zyavPhVPo\nMódulo IV – Capitalismo e Imperialismo hoje. Ministrado por Sofia Manzano\nhttps://www.youtube.com/watch?v=VZlF7aVkJ3w\nMódulo V – Questões práticas da organização do trabalho militante e de base. Ministrado por\nVictor Neves e Talita Tecedor - https://www.youtube.com/watch?v=vjTErNnf-XM\nMódulo VI – Resoluções do XVI Congresso/VIII Conferência e a Estratégia e Tática da\nRevolução Brasileira. Ministrado por Edmilson Costa\nhttps://www.youtube.com/watch?v=UxA3RrFA5Qk\nCultura Comunista\nComo parte essencial das ações de recrutamento e do trabalho de formação política está o\nresgate da cultura comunista, das práticas e valores forjados nas organizações que\nconstroem o campo comunista desde a formação da Liga dos Comunistas, nas lutas da\nclasse trabalhadora no enfrentamento ao capitalismo e às ditaduras, nas experiências\nhistórico-concretas de construção socialista, nas formulações de Marx, Lênin, Engels e\noutros autores e líderes comunistas, na história dos partidos e organizações revolucionárias\nque lutam pela superação do capitalismo.\nÉ necessário recuperar essa construção na ação dos Partidos nas diferentes conjunturas\nque enfrentaram, as histórias de dedicação e solidariedade, de esforço pessoal e\nfraternidade, da disciplina voluntária e da prática da crítica e da autocrítica sincera.\nFaz parte desse resgate o reconhecimento dos valores e vícios burgueses e pequenoburgueses\npresentes nas organizações, que refletem a sociedade onde estão inseridas.\nInveja, narcisismo, carreirismo, autoritarismo (que não deve ser confundido com fazer valer a\nlinha política coletiva para fora ou preservar a integridade organizativa com firmeza) práticas\nconspirativas (críticas frequentes e fora das instâncias etc.), indisciplina e outros desvios\ndevem ser alertados e combatidos, ao passo que os valores da humildade, da capacidade\nautocrítica sincera, do altruísmo, da franqueza, da solidariedade, da construção coletiva, da\ndisciplina e outros devem ser fomentados no convívio entre os/as comunistas e\ncompanheiros/as de luta não comunistas. Estes são também elementos de construção da\nnova sociedade socialista e do referencial do comunismo. O projeto de militância comunista\né árduo, mas não deve ser visto como dogmático, sectário ou imediatista. É um projeto para\na vida toda, capaz de conciliar outras dimensões essenciais de uma vida em harmonia, como\ntrabalho, família, estudo, lazer etc.\nSecretariado Nacional de Organização do PCB\nCOMITÊ CENTRAL\nJulho de 2026";document.getElementById('manual').textContent=manual;try{if(window.jspdf){const d=new jspdf.jsPDF({unit:'mm',format:'a4'});d.setFont('helvetica','normal');d.setFontSize(10);let y=20;for(const paragraph of manual.split('\n')){const lines=d.splitTextToSize(paragraph||' ',170);for(const line of lines){if(y>278){d.addPage();y=20}d.text(line,20,y);y+=5.2}}const url=URL.createObjectURL(d.output('blob'));location.replace(url)}}catch(e){console.error(e)}</script></body></html>
