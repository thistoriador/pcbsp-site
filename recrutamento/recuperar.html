<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar senha · PCB-SP</title><style>body{font:16px system-ui;background:#f5f5f5;color:#222;margin:0}main{max-width:440px;margin:8vh auto;padding:26px;background:white;border-radius:12px;box-shadow:0 2px 14px #0001}h1{color:#b40016;font-size:24px}label{display:block;margin:16px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:7px}input{border:1px solid #aaa}button{margin-top:18px;border:0;background:#b40016;color:white;cursor:pointer}button:disabled{opacity:.6}#msg{margin-top:15px;line-height:1.5}a{color:#a00013}</style></head><body><main><h1>Recuperação de senha</h1><p>Portal de Recrutamento PCB-SP</p><div id="request"><label for="email">E-mail cadastrado</label><input id="email" type="email" autocomplete="email" required><button id="send">Enviar link de recuperação</button></div><div id="change" hidden><label for="pw">Nova senha (mínimo 12 caracteres)</label><input id="pw" type="password" autocomplete="new-password" minlength="12"><label for="confirm">Confirme a nova senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="12"><button id="save">Salvar nova senha</button></div><p id="msg" role="status" aria-live="polite"></p><p><a href="/recrutamento/#admin">Voltar ao login</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://zhrtwoigrmizpwwzpmwr.supabase.co',"sb_publishable_6EL9VyTAmrtm1_CpyRUzVQ_x-6ITY1J",{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
const msg=document.getElementById('msg'),request=document.getElementById('request'),change=document.getElementById('change');
const neutral='Se o e-mail estiver cadastrado, você receberá as instruções de recuperação. Verifique também a caixa de spam.';
let recovery=false;
async function showRecovery(){const {data}=await sb.auth.getSession();if(data.session){recovery=true;request.hidden=true;change.hidden=false;msg.textContent='Informe uma nova senha para concluir a recuperação.'}}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()});
if(location.hash.includes('access_token=')||location.search.includes('code='))showRecovery();
document.getElementById('send').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email||!document.getElementById('email').checkValidity()){msg.textContent='Informe um e-mail válido.';return}const b=document.getElementById('send');b.disabled=true;try{await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://pcbsp.com.br/recrutamento/recuperar.html'});msg.textContent=neutral}catch(e){msg.textContent='Não foi possível processar a solicitação agora. Tente mais tarde.'}finally{b.disabled=false}});
document.getElementById('save').addEventListener('click',async()=>{const pw=document.getElementById('pw').value,confirm=document.getElementById('confirm').value;if(pw.length<12||pw!==confirm){msg.textContent='Use pelo menos 12 caracteres e confirme a mesma senha.';return}const b=document.getElementById('save');b.disabled=true;try{const {data}=await sb.auth.getSession();if(!recovery||!data.session){msg.textContent='Link inválido ou expirado. Solicite outro.';return}const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;await sb.auth.signOut();change.hidden=true;msg.textContent='Senha atualizada. Volte ao login administrativo.'}catch(e){msg.textContent='Não foi possível atualizar a senha. Solicite um novo link.'}finally{b.disabled=false}});
</script></body></html>
