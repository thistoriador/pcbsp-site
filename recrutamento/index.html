  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #b5121b;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 170px;
      max-width: 55%;
      height: auto;
      margin-bottom: 18px;
      border-radius: 20px;
    }

    h1 {
      margin: 0;
      color: #ffd400;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.05;
    }

    h2 {
      margin: 10px 0 0;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.15;
    }

    .lema {
      margin: 18px 0 26px;
      color: #ffd400;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px 15px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
    }

    .entrar {
      background: #ffd400;
      color: #111;
    }

    .instalar {
      display: none;
      background: #111;
      color: #fff;
      border: 2px solid #ffd400;
    }

    .rodape {
      margin-top: 22px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      line-height: 1.4;
    }

  </style>

</head>


<body>

  <main class="card">

    <img
      class="logo"
      src="./icone-recrutamento.png"
      alt="PCB SP"
    >

    <h1>PCB SÃO PAULO</h1>

    <h2>Recrutamento e Circulismo</h2>

    <div class="lema">
      ORGANIZAR • FORMAR • MULTIPLICAR
    </div>


    <a
      class="btn entrar"
      href="./teste/"
    >
      ABRIR NOVO TESTE SUPABASE
    </a>


    <button
      id="installButton"
      class="btn instalar"
      type="button"
    >
      INSTALAR APLICATIVO
    </button>


    <div class="rodape">
      PCB São Paulo
    </div>

  </main>


  <script>

    let deferredPrompt = null;

    const installButton =
      document.getElementById('installButton');


    window.addEventListener(
      'beforeinstallprompt',
      function (event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.style.display = 'block';

      }
    );


    installButton.addEventListener(
      'click',
      async function () {

        if (!deferredPrompt) {
          return;
        }

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        installButton.style.display = 'none';

      }
    );


    window.addEventListener(
      'appinstalled',
      function () {

        deferredPrompt = null;

        installButton.style.display = 'none';

      }
    );


    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        function () {

          navigator.serviceWorker
            .register('./sw.js')
            .catch(function (error) {

              console.log(
                'Erro ao registrar Service Worker:',
                error
              );

            });

        }
      );

    }

  </script>

</body>
