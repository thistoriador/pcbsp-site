<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP2 • Laboratório Auth</title>
<style>
body{font-family:system-ui,sans-serif;background:#171717;color:#f5f5f5;margin:0;padding:24px}
main{max-width:560px;margin:auto;background:#242424;border:1px solid #444;border-radius:16px;padding:24px}
h1{font-size:26px;margin-top:0;color:#ffd21c}.hint{color:#bbb;line-height:1.45}
label{display:block;margin:16px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #666;background:#111;color:#fff;font-size:17px}
button{margin-top:16px;padding:12px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}
.primary{background:#b20d18;color:#fff}.secondary{background:#ffd21c;color:#111;margin-left:8px}
#status{margin-top:18px;padding:12px;background:#111;border-radius:9px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>APP2 • Laboratório de autenticação</h1>
<p class="hint">Ambiente isolado do APP2 principal. Testa Supabase Auth + perfil da Direção sem alterar o login atual.</p>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username">
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password">
<button class="primary" id="login">ENTRAR</button><button class="secondary" id="logout">SAIR</button>
<div id="status">Inicializando…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./auth-supabase.js"></script>
<script>
const statusEl=document.getElementById('status');
let sb=null;
function status(msg){statusEl.textContent=msg}
async function showSession(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){status('Sem sessão autenticada.');return}
 try{
   const p=await PCBOrgAuth.loadProfile(sb,session.user.id);
   status('Autenticado\nPerfil: '+p.display_name+'\nPapel: '+p.role+'\nEscopo: '+p.scope);
 }catch(e){
   await sb.auth.signOut();
   status('Acesso negado: '+e.message);
 }
}
(async()=>{try{sb=PCBOrgAuth.client();await showSession()}catch(e){status('Erro de configuração: '+e.message)}})();
document.getElementById('login').onclick=async()=>{
 if(!sb)return;
 status('Autenticando…');
 const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){status('Login recusado: '+error.message);return}
 await showSession();
};
document.getElementById('logout').onclick=async()=>{if(sb)await sb.auth.signOut();status('Sessão encerrada.');};
</script>
</body></html>
